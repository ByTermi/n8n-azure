<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Compa Chucho 🌮</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1008;
      color: #f0e6d3;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 720px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #3a2010;
      background: #1a1008;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .avatar {
      width: 44px; height: 44px;
      background: #c0392b;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.1rem; font-weight: 700; color: #f5c842; }
    header p  { font-size: 0.75rem; color: #a07850; }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 720px;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .bubble-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .bubble-wrap.user { flex-direction: row-reverse; }

    .bubble-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: #2a1a08;
    }
    .bubble-wrap.user .bubble-avatar { background: #2c5f2e; }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble-wrap.bot .bubble {
      background: #2a1a08;
      border: 1px solid #3a2510;
      border-bottom-left-radius: 4px;
      color: #f0e6d3;
    }

    .bubble-wrap.user .bubble {
      background: #c0392b;
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .bubble strong { color: #f5c842; }
    .bubble em     { color: #c8a87a; font-style: italic; }

    .typing {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 14px;
      background: #2a1a08;
      border: 1px solid #3a2510;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing span {
      width: 7px; height: 7px;
      background: #f5c842;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    #input-area {
      width: 100%;
      max-width: 720px;
      padding: 12px 16px 20px;
      display: flex;
      gap: 10px;
      background: #1a1008;
      border-top: 1px solid #3a2010;
    }

    #msg {
      flex: 1;
      background: #2a1a08;
      border: 1px solid #4a3020;
      border-radius: 24px;
      padding: 10px 16px;
      color: #f0e6d3;
      font-size: 0.9rem;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    #msg:focus { border-color: #c0392b; }
    #msg::placeholder { color: #6a5040; }

    #send {
      width: 44px; height: 44px;
      background: #c0392b;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      transition: background 0.2s, transform 0.1s;
    }
    #send:hover   { background: #e74c3c; }
    #send:active  { transform: scale(0.93); }
    #send:disabled { background: #4a2020; cursor: not-allowed; }

    #send svg { width: 18px; height: 18px; fill: white; }

    .timestamp {
      font-size: 0.65rem;
      color: #6a5040;
      text-align: center;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<header>
  <div class="avatar">🌮</div>
  <div>
    <h1>El Compa Chucho</h1>
    <p>Tu cuate de Tlaquepaque, Jalisco 🇲🇽</p>
  </div>
</header>

<div id="chat">
  <div class="bubble-wrap bot">
    <div class="bubble-avatar">🌮</div>
    <div class="bubble">¡Órale, qué onda compa! Soy el Chucho, tu cuate tamalero de Tlaquepaque. ¿En qué te puedo echar la mano? Y no me vengas con eso de 'hágale pues' que eso es de los colombianos 🇨🇴 jaja ¡fierro!</div>
  </div>
</div>

<div id="input-area">
  <textarea id="msg" placeholder="Escríbele al Compa Chucho..." rows="1"></textarea>
  <button id="send">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  const chat    = document.getElementById('chat');
  const input   = document.getElementById('msg');
  const sendBtn = document.getElementById('send');

  const SESSION_ID = localStorage.getItem('compa_session') || (() => {
    const id = 'web-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('compa_session', id);
    return id;
  })();

  function renderMd(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,     '<strong>$1</strong>')
      .replace(/_(.+?)_/g,       '<em>$1</em>');
  }

  function addBubble(text, role) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap ' + role;

    const av = document.createElement('div');
    av.className = 'bubble-avatar';
    av.textContent = role === 'bot' ? '🌮' : '🧑';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMd(text);

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap bot';
    wrap.id = 'typing-indicator';

    const av = document.createElement('div');
    av.className = 'bubble-avatar';
    av.textContent = '🌮';

    const t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';

    wrap.appendChild(av);
    wrap.appendChild(t);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    addBubble(text, 'user');
    addTyping();

    try {
      const res = await fetch('/webhook/compa-bot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId: SESSION_ID }),
      });
      const data = await res.json();
      removeTyping();
      addBubble(data.respuesta || data.error || 'Sin respuesta', 'bot');
    } catch (err) {
      removeTyping();
      addBubble('Chale compa... error de conexión. Inténtalo de nuevo.', 'bot');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', send);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
